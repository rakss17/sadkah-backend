name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  API_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sadkah-platform-api
  WEB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sadkah-platform-web

jobs:
  ####################################################################
  # Build Docker Images
  ####################################################################
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Image
        run: |
          docker build \
            -t $API_IMAGE:latest \
            -t $API_IMAGE:${{ github.sha }} \
            ./Sadkah.API
          docker push $API_IMAGE:latest
          docker push $API_IMAGE:${{ github.sha }}

      - name: Build and Push Web Image
        run: |
          docker build \
            -t $WEB_IMAGE:latest \
            -t $WEB_IMAGE:${{ github.sha }} \
            ./Sadkah.Web
          docker push $WEB_IMAGE:latest
          docker push $WEB_IMAGE:${{ github.sha }}

  ####################################################################
  # Deploy to VPS
  ####################################################################
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload Deployment Files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}

          # Deployment files to upload (comma-separated, not one-per-line)
          source: "docker-compose.yml,Caddyfile"

          # Directory on the VPS (must be writable by VPS_USERNAME, a non-root user)
          target: sadkah-platform # relative to VPS_USERNAME's home directory

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            mkdir -p ~/sadkah-platform

            cd ~/sadkah-platform

            # Generate .env from GitHub Secrets
            cat > .env <<EOF
            WEB_DOMAIN=${{ secrets.WEB_DOMAIN }}
            API_DOMAIN=${{ secrets.API_DOMAIN }}

            API_PUBLIC_URL=${{ secrets.API_PUBLIC_URL }}
            
            MSSQL_SA_PASSWORD=${{ secrets.MSSQL_SA_PASSWORD }}
            JWT_SIGNING_KEY=${{ secrets.JWT_SIGNING_KEY }}

            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            EOF

            # Pull the latest Docker image
            docker compose pull

            # Recreate containers
            docker compose up -d --remove-orphans

            # Remove dangling images
            docker image prune -f

            # Verify running containers
            docker ps